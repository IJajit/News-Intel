name: Hourly News Intel Trigger

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  hourly-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Hourly Briefing & Web Push
        run: |
          curl -X POST "https://news-intel-lovat.vercel.app/api/cron-hourly" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --fail --max-time 120
